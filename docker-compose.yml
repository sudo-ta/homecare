services:
  postgres:
    image: postgres:16-alpine
    container_name: homecare-pg
    environment:
      POSTGRES_USER: homecare
      POSTGRES_PASSWORD: homecare_dev_pw
      POSTGRES_DB: homecare
    ports:
      - "5436:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homecare -d homecare"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: homecare-redis
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: homecare-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: homecare_minio
      MINIO_ROOT_PASSWORD: homecare_minio_dev_pw
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  miniodata:
